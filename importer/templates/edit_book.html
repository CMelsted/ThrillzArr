{% extends "base.html" %}
{% block title %}ThrillzArr - Edit{% endblock %}
{% block content %}
<div class="columns">
    <div class="column">
        <div class="card">
            <div class="card-header is-center">
                <div class="card-header-title">
                    <p class="title">Edit metadata: {{ book.title }}</p>
                </div>
            </div>
            <form action="{% url 'edit-book' book.pk %}" method="POST">
                {% csrf_token %}
                <div class="card-content">
                    {% for field in form %}
                    <div class="field is-horizontal">
                        <div class="field-body">
                            <div class="field">
                                {{ field.label_tag }}
                                <div class="control">
                                    {{ field }}
                                </div>
                                {% for error in field.errors %}
                                <p class="help is-danger">{{ error }}</p>
                                {% endfor %}
                            </div>
                        </div>
                    </div>
                    {% endfor %}
                </div>
                <footer class="card-footer">
                    <div class="card-footer-item">
                        <div class="control">
                            <button class="button is-link is-fullwidth" type="submit">Save</button>
                        </div>
                    </div>
                    <div class="card-footer-item">
                        <div class="control">
                            <a class="button is-fullwidth" href="{% url 'books' %}">Cancel</a>
                        </div>
                    </div>
                </footer>
            </form>
        </div>
    </div>
</div>
{% endblock %}
